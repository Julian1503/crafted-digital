# Netlify build for juliandelgado.com.au (Next.js via the OpenNext adapter,
# which Netlify installs automatically for Next.js projects).
[build]
  # The Prisma client lives in src/generated (gitignored), so generate it first.
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# The Next.js adapter. Declared explicitly because the site was created from
# the CLI, so Netlify did not auto-install it on remote builds.
[[plugins]]
  package = "@netlify/plugin-nextjs"
